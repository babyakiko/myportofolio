{% extends 'base.html' %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <span class="kaomoji kaomoji-1">(¬‿¬ )</span>
            <span class="kaomoji kaomoji-2">╰(▔∀▔)╯</span>
            <span class="kaomoji kaomoji-3">\(^ヮ^)/</span>
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information System &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo window-card">
                    <div class="window-header">
                        <span class="dot dot-red"></span>
                        <span class="dot dot-yellow"></span>
                        <span class="dot dot-green"></span>
                        <span class="window-title">profile.jpg</span>
                    </div>
                    <div class="window-content">
                        <img class="avatar" src="/static/img/baby.jpeg" alt="Photo of {{ name }}">
                    </div>
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/babyakiko" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/baby-akiko-gracia-23b6b037b/" class="social-link">LinkedIn</a>
                        <a href="mailto:baby.akiko@ui.ac.id" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
 {% endblock content %}
